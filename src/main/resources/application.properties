spring.application.name=Decentralized degree vault backend

# Blockchain Configuration
blockchain.rpc-url=${your_blockchain_rpc_url}
contract.address=${your_contract_address}
wallet.private-key=${your_wallet_private_key}

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/degreevaultdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.decentralized.degree.vault=DEBUG
logging.level.org.web3j=INFO

# Server Configuration
server.port=8080
server.servlet.context-path=/
