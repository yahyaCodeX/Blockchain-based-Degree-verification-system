spring.application.name=Decentralized degree vault backend

# Blockchain Configuration
blockchain.rpc-url=${your_blockchain_rpc_url}
contract.address=${your_contract_address}
wallet.private-key=${your_wallet_private_key}

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/degreevaultdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=12345
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.decentralized.degree.vault=DEBUG
logging.level.org.web3j=INFO

# Server Configuration
server.port=8081
server.servlet.context-path=/

# IPFS Configuration
ipfs.host=127.0.0.1
ipfs.port=5001

# ==================================================================================
# BATCH PROCESSING CONFIGURATION
# ==================================================================================

# Maximum number of degrees per batch (must match smart contract MAX_BATCH_SIZE)
batch.max-size=100

# Async thread pool configuration for batch processing
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10

# Multipart file upload limits (for CSV + ZIP batch upload)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

